name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci:quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, so migrations are applied from scratch on every run. A
    # migration that only works against a hand-tended local database fails here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to what the Dockerfile uses.
          node-version: "22.22.3"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm run ci:quality

      - name: Apply migrations to a fresh database
        run: node dist/migrate.mjs

      - name: Check the schema and migrations agree
        # Fails if someone changed src/db/schema.ts without generating a
        # migration: generate must find nothing to do.
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Schema changes without a committed migration:"
            git status --porcelain drizzle
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image Railway will build, so a Dockerfile regression fails here
      # rather than on deploy. Not pushed anywhere.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: analytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name analytics-ci -p 3000:3000 analytics:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Health check passed"
              docker rm -f analytics-ci
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"
          docker logs analytics-ci
          docker rm -f analytics-ci
          exit 1
