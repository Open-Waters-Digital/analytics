# Local Postgres for development and integration tests, on the major version
# Railway provisions. Port 5433 so it does not collide with another project's
# Postgres on 5432. `pnpm db:down -v` wipes the volume.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
